    <script>
      /* Di dalam bingkai (pratinjau dashboard admin): jangan menyentuh jembatan Android (warna bilah status, layar
         pembuka, dll.), karena itu milik halaman dashboard di luarnya */
      try {
        if (window.top !== window) {
          try {
            window.FadzAndroid = undefined;
          } catch (e) {}
          try {
            Object.defineProperty(window, 'FadzAndroid', { value: undefined, configurable: true });
          } catch (e) {}
        }
      } catch (e) {}
    </script>
    <script>
      /* Tema dipasang sebelum CSS & isi dimuat, agar tidak berkedip putih saat aplikasi dimuat ulang */
      try {
        var qs = new URLSearchParams(location.search),
          z = qs.has('pratinjau') ? { theme: qs.get('tema') || 'light' } : JSON.parse(localStorage.fz || '{}'),
          t =
            z.theme == 'blue'
              ? 'blue'
              : z.theme == 'dark' || (z.theme == 'auto' && matchMedia('(prefers-color-scheme:dark)').matches)
                ? 'dark'
                : 'light';
        document.documentElement.dataset.theme = t;
        var uz =
            z.uz ||
            (localStorage.fz
              ? 'kecil'
              : (function () {
                  var w = Math.min(screen.width || innerWidth, screen.height || innerHeight);
                  return w < 380 ? 'kecil' : w < 420 ? 'sedang' : 'besar';
                })()),
          rs = document.documentElement.style;
        rs.setProperty('--zm', String({ kecil: 0.86, sedang: 0.93, besar: 1 }[uz] || 0.86));
        rs.setProperty('--lt', (z.fl || 12) + 'px');
        rs.setProperty('--tr', (z.fi || 12) + 'px');
        document.documentElement.style.background = { dark: '#121413', blue: '#eef4fb', light: '#ffffff' }[t];
        try {
          var w = { dark: '#121413', blue: '#eef4fb', light: '#ffffff' }[t];
          window.top === window && window.FadzAndroid && FadzAndroid.warnaBar && FadzAndroid.warnaBar(w, w);
        } catch (e) {}
      } catch (e) {}
    </script>
    <style>
      /* Layar pembuka: tampil seketika selagi skrip aplikasi dimuat (menggantikan layar gelap kosong), ditutup
         router.js */
      #pembuka {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 24px;
        text-align: center;
        background: #fff;
        color: #24584a;
        transition: opacity 0.45s ease;
      }
      [data-theme='dark'] #pembuka {
        background: #121413;
        color: #cfe0d7;
      }
      [data-theme='blue'] #pembuka {
        background: #eef4fb;
        color: #1d4f7a;
      }
      #pembuka.tutup {
        opacity: 0;
        pointer-events: none;
      }
      #pembuka img {
        width: 118px;
        height: 118px;
        object-fit: contain;
        animation: pbM 0.7s ease both;
      }
      #pembuka .pbh {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 26px 0 14px;
        opacity: 0.55;
        animation: pbM 0.7s 0.15s ease both;
      }
      #pembuka .pbh i {
        display: block;
        width: 54px;
        height: 1px;
        background: currentColor;
      }
      #pembuka .pbh b {
        display: block;
        width: 7px;
        height: 7px;
        transform: rotate(45deg);
        border: 1px solid currentColor;
      }
      #pembuka p {
        margin: 0;
        font:
          italic 400 21px/1.55 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: 0.2px;
        animation: pbM 0.8s 0.3s ease both;
      }
      #pembuka p span {
        display: block;
      }
      #pembuka small {
        margin-top: 18px;
        font:
          600 11px/1 system-ui,
          sans-serif;
        letter-spacing: 0.32em;
        opacity: 0.6;
        animation: pbM 0.8s 0.55s ease both;
      }
      @keyframes pbM {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pembuka * {
          animation: none !important;
        }
      }
    </style>

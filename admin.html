<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Fadzkuruuni</title>
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<!-- admin.html - Dashboard admin: membaca dan menindaklanjuti laporan dari halaman "Laporkan masalah" (koleksi Firestore 'laporan').
     Hanya email di ADMIN yang bisa masuk; aksesnya dijaga Firestore Rules (lihat PANDUAN-FIREBASE.md). Tidak disimpan offline oleh sw.js. -->
<style>
:root{--bg:#f6f7f6;--card:#fff;--ink:#1d2b25;--mut:#6b7a72;--line:#e5e7e5;--g:#24584a;--gs:#e7eeea;--fill:#f0f2f1;--on:#fff;--red:#b3382a;--amb:#9a6b00;--ambs:#fbf1d9;--reds:#f8e3df}
@media (prefers-color-scheme:dark){:root{--bg:#0e100f;--card:#161917;--ink:#eef2ef;--mut:#9aa6a0;--line:#2c312e;--g:#7fb5a2;--gs:#1d2a26;--fill:#1f2321;--on:#06140f;--red:#ef8a7c;--amb:#e3b54f;--ambs:#2d2615;--reds:#331d1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:var(--g)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{width:32px;height:32px;border-radius:8px}
header b{flex:1;font-size:16px}
header small{color:var(--mut);font-size:12px}
.btn{height:36px;padding:0 14px;border:0;border-radius:9px;background:var(--g);color:var(--on);font-weight:600;cursor:pointer}
.btn.s{background:var(--fill);color:var(--ink)}
.btn.d{background:var(--reds);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.gate{max-width:420px;margin:12vh auto;padding:28px 24px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center}
.gate img{width:56px;height:56px;border-radius:12px}
.gate h1{margin:12px 0 4px;font-size:20px}
.gate p{margin:0 0 18px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stats button{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;cursor:pointer}
.stats button b{display:block;font-size:22px}
.stats button span{color:var(--mut);font-size:13px}
.stats button.on{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bar input,.bar select{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.bar input{flex:1;min-width:180px}
.card{margin-bottom:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.card.baru{border-left:4px solid var(--g)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.chip{padding:2px 9px;border-radius:99px;background:var(--gs);color:var(--g);font-size:12px;font-weight:600}
.chip.st-baru{background:var(--g);color:var(--on)}
.chip.st-diproses{background:var(--ambs);color:var(--amb)}
.chip.st-selesai{background:var(--fill);color:var(--mut)}
.top time{margin-left:auto;color:var(--mut);font-size:12px}
.msg{margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0 0 10px;font-size:13px}
.meta dt{color:var(--mut)}
.meta dd{margin:0;word-break:break-word}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fotos img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.act select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.act textarea{flex:1 1 100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--fill);resize:vertical}
.act small{color:var(--mut);font-size:12px}
.act .sp{flex:1}
.empty{padding:40px 16px;color:var(--mut);text-align:center}
.lb{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.85);cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:20px;z-index:30;padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;transform:translate(-50%,10px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:1fr}.meta dt{margin-top:4px}}
</style>
</head>
<body>
<div id="root"><div class="gate"><p>Memuat…</p></div></div>
<div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Sama dengan FBCFG di js/core/cloud.js */
const FBCFG={apiKey:'AIzaSyDBSyWkPR0ZBDDaHuHAfSzPJfdmx_H0hmE',authDomain:'fadzkuruuni-88a8b.firebaseapp.com',projectId:'fadzkuruuni-88a8b',storageBucket:'fadzkuruuni-88a8b.firebasestorage.app',messagingSenderId:'530459763811',appId:'1:530459763811:web:db2a65d6d2e72201544456'};
/* Daftar admin. Ubah juga daftar yang sama di Firestore Rules agar aksesnya benar-benar terkunci. */
const ADMIN=['hilmykia@gmail.com','ponpesfadzkuruuni@gmail.com'];
const STATUS=[['baru','Baru'],['diproses','Diproses'],['selesai','Selesai']];
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),2400)};
const tgl=t=>t?new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const APP=location.href.replace(/admin\.html.*$/,'');
firebase.initializeApp(FBCFG);const auth=firebase.auth(),db=firebase.firestore();
let L=[],F={st:'baru',j:'',q:''},stop=null,tunda=0;

const gate=(judul,isi,tombol)=>$('#root').innerHTML=`<div class="gate"><img src="img/icon-192.png" alt=""><h1>${judul}</h1><p>${isi}</p>${tombol||''}</div>`;
const masuk=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{const c=e.code||'';if(c=='auth/popup-blocked'||c=='auth/operation-not-supported-in-this-environment')return auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());if(c!='auth/popup-closed-by-user')toast('Gagal masuk: '+(c=='auth/unauthorized-domain'?'domain ini belum diizinkan di Firebase':c))});

auth.onAuthStateChanged(u=>{stop&&stop();stop=null;
 if(!u)return gate('Dashboard Admin','Masuk dengan akun Google admin untuk melihat laporan pengguna.','<button class="btn" id="in">Masuk dengan Google</button>'),$('#in').onclick=masuk;
 if(!ADMIN.includes((u.email||'').toLowerCase()))return gate('Akses ditolak',`Akun <b>${esc(u.email)}</b> bukan admin Fadzkuruuni.`,'<button class="btn s" id="out">Ganti akun</button>'),$('#out').onclick=()=>auth.signOut();
 $('#root').innerHTML=`<header><img src="img/icon-192.png" alt=""><b>Laporan Fadzkuruuni</b><small>${esc(u.email)}</small><button class="btn s" id="out">Keluar</button></header><div class="wrap"><div class="stats" id="stats"></div><div class="bar"><input id="q" type="search" placeholder="Cari isi laporan, nama, halaman…"><select id="j"><option value="">Semua jenis</option><option>Bug</option><option>Salah tulis</option><option>Konten kurang</option><option>Saran</option></select></div><div id="list"><div class="empty">Memuat laporan…</div></div></div>`;
 $('#out').onclick=()=>auth.signOut();
 $('#q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();tampil()};
 $('#j').onchange=e=>{F.j=e.target.value;tampil()};
 /* Laporan baru muncul langsung tanpa memuat ulang */
 stop=db.collection('laporan').orderBy('t','desc').limit(500).onSnapshot(s=>{L=s.docs.map(d=>({id:d.id,...d.data()}));/* Jangan gambar ulang saat admin sedang mengetik catatan */if(document.activeElement?.matches('[data-cat]'))tunda=1;else tampil()},e=>{$('#list').innerHTML=`<div class="empty">Tidak bisa membaca laporan (${esc(e.code||e.message)}).<br>Pastikan Firestore Rules untuk admin sudah dipasang (lihat PANDUAN-FIREBASE.md).</div>`})});

const stOf=r=>r.status||'baru';
function tampil(){
 const n=k=>L.filter(r=>!k||stOf(r)==k).length;
 $('#stats').innerHTML=[['','Semua'],...STATUS].map(([k,t])=>`<button data-st="${k}" class="${F.st==k?'on':''}"><b>${n(k)}</b><span>${t}</span></button>`).join('');
 const X=L.filter(r=>(!F.st||stOf(r)==F.st)&&(!F.j||r.jenis==F.j)&&(!F.q||[r.pesan,r.nama,r.kontak,r.email,r.halJudul,r.hal,r.lokasi,r.catatan].join(' ').toLowerCase().includes(F.q)));
 $('#list').innerHTML=X.length?X.map(kartu).join(''):'<div class="empty">Tidak ada laporan di sini.</div>'}
function kartu(r){const st=stOf(r),foto=Array.isArray(r.foto)?r.foto:r.foto?[r.foto]:[],p=r.perangkat||{};
 const meta=[['Halaman',r.hal?`${esc(r.halJudul||r.hal)} · <a href="${esc(APP+r.hal)}" target="_blank" rel="noopener">Buka di aplikasi</a>`:''],['Bagian',esc(r.lokasi)],['Atas nama',esc(r.nama)],['Kontak',esc(r.kontak)],['Akun',esc(r.email)],['Perangkat',[p.layar,p.pwa?'aplikasi terpasang':'',esc(p.ua)].filter(Boolean).join(' · ')],['Versi',esc(r.versi)]].filter(x=>x[1]);
 return `<article class="card ${st}" data-id="${r.id}"><div class="top"><span class="chip st-${st}">${STATUS.find(s=>s[0]==st)[1]}</span><span class="chip">${esc(r.jenis||'-')}</span><time>${tgl(r.t)}</time></div>
 <p class="msg">${esc(r.pesan)}</p><dl class="meta">${meta.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
 ${foto.length?`<div class="fotos">${foto.map((f,i)=>`<img src="${esc(f)}" alt="Foto ${i+1}" data-lb>`).join('')}</div>`:''}
 <div class="act"><select data-ss aria-label="Status">${STATUS.map(([k,t])=>`<option value="${k}" ${k==st?'selected':''}>${t}</option>`).join('')}</select><span class="sp"></span>${r.oleh?`<small>Diubah ${esc(r.oleh)} · ${tgl(r.diubah)}</small>`:''}<button class="btn d" data-del>Hapus</button>
 <textarea data-cat placeholder="Catatan tindak lanjut (hanya terlihat oleh admin)">${esc(r.catatan)}</textarea></div></article>`}

const ubah=(id,d)=>db.collection('laporan').doc(id).update({...d,oleh:auth.currentUser.email,diubah:Date.now()}).catch(e=>toast('Gagal menyimpan: '+(e.code||e.message)));
document.addEventListener('click',e=>{const t=e.target;
 const s=t.closest('[data-st]');if(s){F.st=s.dataset.st;tampil();return}
 if(t.matches('[data-lb]')){const b=document.createElement('div');b.className='lb';b.innerHTML=`<img src="${t.src}" alt="">`;b.onclick=()=>b.remove();document.body.append(b);return}
 if(t.matches('[data-del]')){const id=t.closest('[data-id]').dataset.id;if(confirm('Hapus laporan ini secara permanen?'))db.collection('laporan').doc(id).delete().then(()=>toast('Laporan dihapus'),e=>toast('Gagal menghapus: '+(e.code||e.message)))}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-ss]'))ubah(t.closest('[data-id]').dataset.id,{status:t.value}).then(()=>toast('Status diperbarui'))});
document.addEventListener('focusout',e=>{const t=e.target;if(!t.matches('[data-cat]'))return;if(tunda){tunda=0;setTimeout(tampil,300)}const id=t.closest('[data-id]').dataset.id,r=L.find(x=>x.id==id);if(r&&(r.catatan||'')!=t.value.trim())ubah(id,{catatan:t.value.trim()}).then(()=>toast('Catatan disimpan'))});
addEventListener('keydown',e=>{if(e.key=='Escape')document.querySelector('.lb')?.remove()});
</script>
</body>
</html>

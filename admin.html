 $('#root').innerHTML=`<div class="atas" id="atas"><header><img src="img/icon-192.png" alt=""><b>Dashboard Fadzkuruuni</b><small>${esc(u.email)}${PEMILIK?' · pemilik':''}</small><button class="ikb" id="set" aria-label="Pengaturan dashboard" title="Pengaturan dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button></header><nav class="atab" id="atab">${TABS.map(([k,t])=>`<a href="#${k}" data-tab="${k}">${t}</a>`).join('')}</nav></div><div class="wrap" id="isi"></div>`;

 ${PEMILIK?`<div class="tam tam-adm"><input id="ae" type="email" placeholder="email@gmail.com"><div class="akl">Akses</div>${pilih('apn',['semua'])}<button class="btn" id="at">Tambah admin</button></div>`:'<p style="margin-top:10px">Hanya pemilik yang bisa mengubah daftar ini.</p>'}</div>`;
 /* "Semua akses" dan akses tertentu saling meniadakan */
 $('#isi').onchange=e=>{const c=e.target.closest('.akp input');if(!c)return;const g=c.closest('.akp');if(c.value=='semua'&&c.checked)g.querySelectorAll('input:not([value=semua])').forEach(x=>x.checked=false);else if(c.checked)g.querySelector('[value=semua]').checked=false};
 const ambil=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value);
 const simpan=async(L,A)=>{try{await db.collection('config').doc('admin').set({emails:L,akses:A,oleh:auth.currentUser.email,t:Date.now()});ADMX=L;ADMA=A;tabAdmin();toast('Daftar admin disimpan')}catch(e){toast('Gagal menyimpan: '+(e.code=='permission-denied'?'Firestore Rules belum dipasang':(e.code||e.message)))}};
 $('#isi').onclick=e=>{const h=e.target.closest('[data-ah]');if(h&&confirm('Hapus admin ini?')){const em=ADMX[+h.dataset.ah],A={...ADMA};delete A[em];return simpan(ADMX.filter((_,i)=>i!=+h.dataset.ah),A)}
  const u=e.target.closest('[data-au]');if(u){const p=$('#au'+u.dataset.au);p.hidden=!p.hidden;return}
  const sv=e.target.closest('[data-as]');if(sv){const L=ambil('ap'+sv.dataset.as);if(!L.length)return toast('Pilih minimal satu akses');return simpan(ADMX,{...ADMA,[ADMX[+sv.dataset.as]]:L})}
  if(e.target.id=='at'){const v=$('#ae').value.trim().toLowerCase(),L=ambil('apn');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return toast('Email tidak valid');if(ADMIN.includes(v)||ADMX.includes(v))return toast('Sudah admin');if(!L.length)return toast('Pilih minimal satu akses');simpan([...ADMX,v],{...ADMA,[v]:L})}}}

/* ===== Kelas online: jadwal, mulai / akhiri, tautan rekaman. Suara lewat LiveKit (api/kelas). ===== */
async function tabKelas(){$('#isi').innerHTML='<div class="empty">Memuat kelas…</div>';
 let L=[],siap=null;try{L=(await db.collection('kelas').get()).docs.map(d=>({id:d.id,...d.data()}))}catch(e){return $('#isi').innerHTML='<div class="empty">Gagal membaca kelas: '+esc(e.code||e.message)+'. Pastikan Firestore Rules terbaru sudah dipublish.</div>'}
 try{siap=(await fetch('api/kelas',{method:'POST',headers:{'content-type':'application/json'},body:'{"aksi":"cek"}'})).ok}catch(e){}
 const jam=t=>t?new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-',st={live:'● Live',jadwal:'Terjadwal',selesai:'Selesai'};
 L.sort((a,b)=>({live:0,jadwal:1,selesai:2}[a.status]??1)-({live:0,jadwal:1,selesai:2}[b.status]??1)||(a.status=='selesai'?(b.mulai||0)-(a.mulai||0):(a.mulai||0)-(b.mulai||0)));
 $('#isi').innerHTML=(siap===false?'<div class="blok" style="border-color:#e0a030"><h3>Server suara belum disiapkan</h3><p>Isi LIVEKIT_URL, LIVEKIT_API_KEY, dan LIVEKIT_API_SECRET di Vercel (Settings › Environment Variables), lalu Redeploy. Sebelum itu jamaah belum bisa masuk kelas.</p></div>':'')
 +'<div class="blok" style="border-color:#e0a030"><h3>Batas paket gratis LiveKit</h3><p>Suara kelas memakai LiveKit Cloud paket gratis. Jatah menit pemakaiannya terbatas tiap bulan (dihitung per pendengar per menit). Bila habis, kelas tidak bisa dimasuki sampai bulan berikutnya. Pantau di <a href="https://cloud.livekit.io" target="_blank" rel="noopener">cloud.livekit.io</a>.</p></div>'
 +`<div class="blok"><h3>Buat kelas</h3><p>Hanya admin yang bisa membuat dan memulai kelas. Admin bisa ditambah di tab Admin. Pengajar memulai kelas dari aplikasi (Kelas online › Mulai kelas) agar mikrofonnya tersambung.</p>
  <div class="fl" style="display:grid;gap:8px"><input id="kj" maxlength="80" placeholder="Judul, mis. Ngaji Aqidatul Awam"><input id="kp" maxlength="60" placeholder="Pengajar"><input id="kw" type="datetime-local"><input id="kk" maxlength="160" placeholder="Keterangan (opsional)"><input id="ky" type="url" placeholder="Link YouTube: live streaming atau video lama (opsional)"><small style="opacity:.75">Untuk video YouTube lama: isi link, judul, dan tanggal aslinya (boleh yang sudah lewat), lalu tekan <b>Simpan sebagai video</b>. Video tampil di "Sudah selesai" dan bisa diputar ulang jamaah.</small><select id="km"><option value="mesh"${siap===false?' selected':''}>Kelas kecil (±10 jamaah, tanpa LiveKit)</option><option value="livekit"${siap===false?'':' selected'}>Kelas besar (LiveKit)</option></select>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="kr" style="flex:none;height:auto"> Rekam kelas (video layar/kamera + semua suara, disimpan di perangkat pengajar)</label><label style="display:flex;gap:8px;align-items:center">Format rekaman <select id="krf" style="flex:1"><option value="mp4">MP4 (video, disarankan)</option><option value="webm">WebM (video)</option><option value="audio">Suara saja</option></select></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="kb">Simpan jadwal</button><button class="btn s" id="kbv">Simpan sebagai video</button></div></div></div>`
 +`<div class="blok"><h3>Daftar kelas</h3><div class="ls">${L.map(k=>`<div class="it" style="flex-wrap:wrap"><span style="flex:1;min-width:180px"><b>${esc(k.judul||'Kelas')}</b><br><small>${st[k.status]||'Terjadwal'} · ${jam(k.mulai)}${k.pengajar?' · '+esc(k.pengajar):''}${k.rekam?' · direkam '+({mp4:'MP4',webm:'WebM',audio:'suara'}[k.rekamFmt]||'MP4'):''}${k.yt?' · YouTube':k.mode=='mesh'?' · kelas kecil':''}</small><br><input type="datetime-local" data-ktw="${k.id}" value="${k.mulai?new Date(k.mulai-new Date(k.mulai).getTimezoneOffset()*6e4).toISOString().slice(0,16):''}" style="margin-top:6px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit"> <button class="btn s" data-ktws="${k.id}" style="height:32px">Simpan tanggal</button>${k.status=='selesai'?`<br><input data-kru="${k.id}" placeholder="Tautan rekaman (Drive/YouTube)" value="${esc(k.rekaman||'')}" style="width:100%;margin-top:6px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit">`:''}</span>
  ${k.status=='live'?`<button class="btn s" data-kst="${k.id}" data-v="selesai">Akhiri</button>`:k.status!='selesai'?`<button class="btn s" data-kst="${k.id}" data-v="live">Mulai</button>`:`<button class="btn s" data-krs="${k.id}">Simpan tautan</button>`}<button class="btn d" data-kh="${k.id}">Hapus</button></div>`).join('')||'<div class="empty">Belum ada kelas.</div>'}</div></div>`;
 const d=new Date(Date.now()+3600e3);d.setMinutes(0,0,0);$('#kw').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 $('#isi').onclick=async e=>{const t=e.target;try{
  const ytA=v=>((v||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/|shorts\/))([\w-]{11})/)||[])[1]||'';
  if(t.id=='kbv'){const j=$('#kj').value.trim(),id=ytA($('#ky').value),w=new Date($('#kw').value).getTime();if(!id)return toast('Isi link YouTube');if(!j)return toast('Isi judul');if(!w)return toast('Isi tanggal video');
   await db.collection('kelas').add({judul:j,pengajar:$('#kp').value.trim(),ket:$('#kk').value.trim(),mulai:w,status:'selesai',rekaman:'https://youtu.be/'+id,yt:'',mode:'mesh',oleh:auth.currentUser.email,dibuat:Date.now()});toast('Video disimpan di "Sudah selesai"');return tabKelas()}
  const tw=t.closest('[data-ktws]');if(tw){const w=new Date($(`[data-ktw="${tw.dataset.ktws}"]`).value).getTime();if(!w)return toast('Isi tanggal');await db.collection('kelas').doc(tw.dataset.ktws).update({mulai:w});toast('Tanggal diubah');return tabKelas()}
  /* Notifikasi ke peramban jamaah yang berlangganan (Web Push, lihat api/push.js) */
  const siarkanKelas=async(id,jenis)=>{try{await fetch('api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({aksi:'kirim',kelas:id,jenis,idToken:await auth.currentUser.getIdToken()})})}catch(e){}};
  if(t.id=='kb'){const j=$('#kj').value.trim();if(!j)return toast('Isi judul');await db.collection('kelas').add({judul:j,pengajar:$('#kp').value.trim(),ket:$('#kk').value.trim(),mulai:new Date($('#kw').value).getTime()||Date.now(),status:'jadwal',rekam:$('#kr').checked,rekamFmt:$('#krf').value,mode:$('#km').value,yt:((($('#ky').value||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/|shorts\/))([\w-]{11})/)||[])[1]||''),oleh:auth.currentUser.email,dibuat:Date.now()}).then(r=>siarkanKelas(r.id,'baru'));toast('Kelas dijadwalkan');return tabKelas()}
  const s=t.closest('[data-kst]');if(s){const v=s.dataset.v;await db.collection('kelas').doc(s.dataset.kst).update(v=='live'?{status:'live',mulai:Date.now()}:{status:v});if(v=='live')siarkanKelas(s.dataset.kst,'mulai');toast(v=='live'?'Kelas dimulai. Buka aplikasi untuk berbicara.':'Kelas diakhiri');return tabKelas()}
  const r=t.closest('[data-krs]');if(r){const v=$(`[data-kru="${r.dataset.krs}"]`).value.trim();if(v&&!/^https?:\/\//.test(v))return toast('Tautan harus diawali https://');await db.collection('kelas').doc(r.dataset.krs).update({rekaman:v});return toast('Tautan rekaman disimpan')}
  const h=t.closest('[data-kh]');if(h&&confirm('Hapus kelas ini?')){await db.collection('kelas').doc(h.dataset.kh).delete();return tabKelas()}
 }catch(x){toast('Gagal: '+(x.code=='permission-denied'?'Firestore Rules belum dipasang':(x.code||x.message)))}}}

/* ===== Pengaturan dashboard (pojok kanan atas): tema Ikuti aplikasi / Terang / Gelap / Biru, buka aplikasi, keluar ===== */
/* "Ikuti aplikasi" (auto): sama dengan tema yang dipilih di aplikasi Fadzkuruuni di perangkat ini; bila aplikasi memakai tema perangkat, ikut perangkat */
const temaDash=t=>{try{t&&t!='auto'?localStorage.fzadmtema=t:delete localStorage.fzadmtema}catch(e){}fzWarna()};
function menuSet(){const ada=$('.mnu');if(ada)return ada.remove();const kini=(()=>{try{return localStorage.fzadmtema||'auto'}catch(e){return 'auto'}})();
 const m=document.createElement('div');m.className='mnu';m.innerHTML=`<b>Tema dashboard</b>${[['auto','Ikuti aplikasi'],['terang','Terang'],['gelap','Gelap'],['biru','Biru']].map(([k,t])=>`<button data-tm="${k}" class="${k==kini?'on':''}">${t}</button>`).join('')}<hr><button data-mn="app">Buka aplikasi</button><button data-mn="out">Keluar (${esc(auth.currentUser?.email||'')})</button>`;
 $('#atas').append(m);m.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tm){temaDash(b.dataset.tm);m.remove();return}if(b.dataset.mn=='app')keApp();if(b.dataset.mn=='out')auth.signOut().then(()=>toast('Kamu sudah keluar')).catch(e=>toast('Gagal keluar: '+(e.code||e.message)));m.remove()}}
document.addEventListener('click',e=>{if(!e.target.closest('.mnu,#set'))$('.mnu')?.remove()});
/* Bilah atas bersembunyi saat digulir ke bawah, muncul saat digulir ke atas */
{let y0=scrollY;addEventListener('scroll',()=>{const a=$('#atas');if(!a)return;const y=scrollY,d=y-y0;a.classList.toggle('lyg',y>4);if(Math.abs(d)>6){a.classList.toggle('smb',d>0&&y>120&&!a.contains(document.activeElement)&&!$('.mnu'));y0=y}},{passive:true})}
</script>

const MODES=['ascii','dither','rgb','slice','thermal','mosaic','raw'];
const BLENDS=['normal','screen','difference','lighten','luminosity','exclusion','hard-light'];
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const cache=new Map();

function drawSrc(im,w,h,crop){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 if(crop)x.drawImage(im,im.width*crop.x,im.height*crop.y,im.width*crop.w,im.height*crop.h,0,0,w,h);
 else{const s=Math.max(w/im.width,h/im.height);x.drawImage(im,(w-im.width*s)/2,(h-im.height*s)/2,im.width*s,im.height*s);}return c;}

 else if(mode==='dither'){const o=x.createImageData(w,h),q=o.data;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const p=(yy*w+xx)*4;const on=L(p)>(BAYER[((yy>>1)%4)*4+((xx>>1)%4)]+.5)/16;q[p]=on?255:4;q[p+1]=on?62:5;q[p+2]=on?136:7;q[p+3]=255;}x.putImageData(o,0,0);}
 else if(mode==='rgb'){const o=x.createImageData(w,h),q=o.data,s=Math.round(w*R(.02,.06));for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const p=(yy*w+xx)*4;q[p]=d[(yy*w+Math.min(w-1,xx+s))*4];q[p+1]=d[p+1]*.5;q[p+2]=d[(yy*w+Math.max(0,xx-s))*4+2];q[p+3]=255;}x.putImageData(o,0,0);}
 else if(mode==='thermal'){const o=x.createImageData(w,h),q=o.data;for(let p=0;p<d.length;p+=4){const l=L(p);q[p]=Math.min(255,l*510);q[p+1]=Math.max(0,(l-.45)*510);q[p+2]=l<.5?(.5-l)*510:(l-.85)*1500;q[p+3]=255;}x.putImageData(o,0,0);}
 else if(mode==='mosaic'){const s=Math.max(6,w/12|0);for(let yy=0;yy<h;yy+=s)for(let xx=0;xx<w;xx+=s){const p=((yy+s/2|0)*w+(xx+s/2|0))*4;if(p>=d.length)continue;x.fillStyle=`rgb(${d[p]},${d[p+1]},${d[p+2]})`;x.fillRect(xx,yy,s-1,s-1);}}
 else{x.drawImage(src,0,0);x.globalCompositeOperation='color';x.fillStyle='#145c70';x.fillRect(0,0,w,h);x.globalCompositeOperation='source-over';for(let k=0;k<12;k++){const sy=R(0,h)|0,s2=R(3,h*.1)|0;x.drawImage(src,0,sy,w,s2,R(-w*.25,w*.25),sy,w,s2);if(Math.random()<.4){x.fillStyle=Math.random()<.5?'rgba(255,62,136,.4)':'rgba(92,225,255,.4)';x.fillRect(0,sy,w,s2);}}}}

nameEls.forEach(el=>el.textContent=[...NAME].map(c=>c===' '?' ':(Math.random()<.55?'#':c)).join(''));

["DJIA","KY-MIND","K.","ERR_0x4D","///"].forEach(t=>{const el=document.createElement('div');el.className='huge';el.textContent=t;el.setAttribute('aria-hidden','true');add('huge',el);});
PH.forEach(f=>{const el=document.createElement('div');el.className='ph';el.innerHTML='<canvas></canvas>';el.setAttribute('aria-hidden','true');add('ph',el,`img/${f}.jpg`);});
for(let i=0;i<(innerWidth<700?8:16);i++){const el=document.createElement('div');el.className='ph';el.innerHTML='<canvas></canvas>';el.setAttribute('aria-hidden','true');add('shard',el,'img/k00.jpg');}
[...document.getElementById('frags').content.children].forEach(n=>add('fr',n.cloneNode(true)));

/* hover or tap a piece to hold it still (so links can be clicked); tap a photo to re-corrupt it */
let held=null;
stage.addEventListener('pointerover',e=>{const it=e.target.closest('.it');if(it&&e.pointerType==='mouse'){held=it;it.classList.add('held');}});
stage.addEventListener('pointerout',e=>{const it=e.target.closest('.it');if(it&&!it.contains(e.relatedTarget)){it.classList.remove('held');if(held===it)held=null;}});
stage.addEventListener('click',e=>{const it=e.target.closest('.it');if(!it)return;const p=pieces.find(q=>q.el===it);
 if(e.pointerType!=='mouse'&&!e.target.closest('a')){if(held&&held!==it)held.classList.remove('held');held=held===it?null:it;it.classList.toggle('held',held===it);}
 if(p&&(p.kind==='ph'||p.kind==='shard')&&p.im){p.mode=pick(MODES);p.el.style.mixBlendMode=pick(BLENDS);render(p.el.querySelector('canvas'),p.im,p.mode,p.crop);}});

/* random photo glitch-jumps */
setInterval(()=>{if(RM)return;const ps=pieces.filter(p=>(p.kind==='ph'||p.kind==='shard')&&p.im&&p.el!==held);const p=pick(ps);if(!p)return;
 p.x=R(-50,W-100);p.mode=pick(MODES);render(p.el.querySelector('canvas'),p.im,p.mode,p.crop);},250);

function tick(){frameRain();
 for(const p of pieces){if(p.el!==held&&!RM){p.y+=p.v;p.x+=p.vx;p.r+=p.vr;if(p.y>H+40)respawn(p,false);}
  p.el.style.transform=`translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${p.r.toFixed(1)}deg)`;}
 if(!RM)requestAnimationFrame(tick);}

function start(){setup();pieces.forEach(p=>respawn(p,true));tick();}
let lw=W;addEventListener('resize',()=>{if(Math.abs(innerWidth-lw)<60&&Math.abs(innerHeight-H)<120)return;lw=innerWidth;setup();pieces.forEach(p=>respawn(p,true));});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
})();
</script>

</html>
